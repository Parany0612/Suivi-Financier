<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivi Financier</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f3;
    --bg-tertiary: #eeede9;
    --text-primary: #1a1a18;
    --text-secondary: #6b6b66;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --income: #1D9E75;
    --expense: #D85A30;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  body { font-family: var(--font); background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; }
  .topbar { background: var(--bg-primary); border-bottom: 0.5px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 12px; height: 56px; position: sticky; top: 0; z-index: 10; }
  .topbar-title { font-size: 16px; font-weight: 500; }
  .topbar-sub { font-size: 12px; color: var(--text-secondary); }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .tabs { display: flex; gap: 0; border-bottom: 0.5px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 10px 22px; font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all .2s; font-family: var(--font); display: flex; align-items: center; gap: 7px; }
  .tab.active { color: var(--text-primary); border-bottom: 2px solid var(--text-primary); font-weight: 500; }
  .tab:hover:not(.active) { color: var(--text-primary); background: var(--bg-secondary); }
  .section { display: none; } .section.active { display: block; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: var(--bg-primary); border-radius: var(--radius-md); padding: 1rem; border: 0.5px solid var(--border); }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .metric-value { font-size: 18px; font-weight: 500; }
  .panel { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .panel-title { font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .6rem; }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; margin-bottom: 1rem; }
  .form-row-2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 0; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-secondary); }
  input[type=date], input[type=number], input[type=text], select {
    font-size: 13px; padding: 7px 10px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-md); background: var(--bg-primary);
    color: var(--text-primary); width: 100%; font-family: var(--font);
  }
  input:focus, select:focus { outline: 2px solid rgba(0,0,0,0.15); }
  .btn { padding: 7px 14px; font-size: 13px; border-radius: var(--radius-md); border: 0.5px solid var(--border-md); background: var(--bg-primary); color: var(--text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--font); }
  .btn:hover { background: var(--bg-secondary); }
  .btn.primary { background: var(--text-primary); color: var(--bg-primary); border-color: var(--text-primary); }
  .btn.primary:hover { opacity: .85; }
  .btn.danger { color: var(--expense); border-color: transparent; }
  .btn.danger:hover { background: #FAECE7; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .cats-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: .75rem; min-height: 30px; }
  .cat-tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; background: var(--bg-secondary); border: 0.5px solid var(--border); cursor: default; display: inline-flex; align-items: center; gap: 5px; }
  .cat-tag .remove { opacity: .5; font-size: 11px; cursor: pointer; line-height: 1; }
  .cat-tag .remove:hover { opacity: 1; color: var(--expense); }
  .add-cat { display: flex; gap: 7px; align-items: center; }
  .add-cat input { width: 160px; }
  .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-row select, .filter-row input[type=date] { font-size: 12px; padding: 5px 8px; width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-secondary); padding: 6px 10px; border-bottom: 0.5px solid var(--border); }
  tbody tr { border-bottom: 0.5px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg-secondary); }
  td { padding: 9px 10px; vertical-align: middle; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge.recette { background: #E1F5EE; color: #0F6E56; }
  .badge.depense { background: #FAECE7; color: #993C1D; }
  .badge.dette { background: #FAECE7; color: #993C1D; }
  .badge.créance { background: #E1F5EE; color: #0F6E56; }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-secondary); font-size: 13px; }
  .empty i { font-size: 28px; display: block; margin-bottom: 8px; opacity: .4; }
  .divider { height: 0.5px; background: var(--border); margin: 1rem 0; }
</style>
</head>
<body>

<div class="topbar">
  <i class="ti ti-chart-pie" style="font-size:20px;color:#1D9E75"></i>
  <div>
    <div class="topbar-title">Suivi Financier</div>
    <div class="topbar-sub">Dépenses · Recettes · Dettes · Créances</div>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('depenses')">
      <i class="ti ti-trending-up"></i> Dépenses &amp; Recettes
    </button>
    <button class="tab" onclick="switchTab('dettes')">
      <i class="ti ti-scale"></i> Dettes &amp; Créances
    </button>
  </div>

  <!-- ====== DÉPENSES & RECETTES ====== -->
  <div class="section active" id="sec-depenses">
    <div class="summary-grid" id="sum-dr"></div>

    <!-- Paramétrage -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><i class="ti ti-tags"></i> Natures de transaction</div>
      </div>
      <div class="section-label">Dépenses</div>
      <div class="cats-row" id="cats-depenses"></div>
      <div class="add-cat" style="margin-bottom:1rem">
        <input type="text" id="new-dep" placeholder="Nouvelle nature de dépense..." />
        <button class="btn small primary" onclick="addCat('depenses')"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
      <div class="divider"></div>
      <div class="section-label" style="margin-top:.75rem">Recettes</div>
      <div class="cats-row" id="cats-recettes"></div>
      <div class="add-cat">
        <input type="text" id="new-rec" placeholder="Nouvelle nature de recette..." />
        <button class="btn small primary" onclick="addCat('recettes')"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>

    <!-- Saisie -->
    <div class="panel">
      <div class="panel-title" style="margin-bottom:1rem"><i class="ti ti-pencil"></i> Nouvelle transaction</div>
      <div class="form-row">
        <div class="field"><label>Date</label><input type="date" id="dr-date" /></div>
        <div class="field"><label>Type</label>
          <select id="dr-type" onchange="updateDrNature()">
            <option value="recette">Recette</option>
            <option value="depense">Dépense</option>
          </select>
        </div>
        <div class="field"><label>Nature</label><select id="dr-nature"></select></div>
        <div class="field"><label>Montant (Ar)</label><input type="number" id="dr-montant" placeholder="0" min="0" /></div>
      </div>
      <div class="form-row-2">
        <div class="field"><label>Description (optionnel)</label><input type="text" id="dr-desc" placeholder="Précisions..." /></div>
        <button class="btn primary" onclick="addDR()"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>

    <!-- Journal -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><i class="ti ti-list"></i> Journal</div>
        <button class="btn small" onclick="exportCSV('dr')"><i class="ti ti-download"></i> Exporter CSV</button>
      </div>
      <div class="filter-row">
        <select id="f-dr-type" onchange="renderDR()">
          <option value="">Tous types</option>
          <option value="recette">Recettes</option>
          <option value="depense">Dépenses</option>
        </select>
        <select id="f-dr-nature" onchange="renderDR()"><option value="">Toutes natures</option></select>
        <input type="date" id="f-dr-from" onchange="renderDR()" title="Du" />
        <input type="date" id="f-dr-to" onchange="renderDR()" title="Au" />
        <button class="btn small" onclick="resetFilters('dr')"><i class="ti ti-x"></i> Réinitialiser</button>
      </div>
      <div id="table-dr"></div>
    </div>
  </div>

  <!-- ====== DETTES & CRÉANCES ====== -->
  <div class="section" id="sec-dettes">
    <div class="summary-grid" id="sum-dc"></div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><i class="ti ti-tags"></i> Natures de dette/créance</div>
      </div>
      <div class="section-label">Dettes</div>
      <div class="cats-row" id="cats-dettes"></div>
      <div class="add-cat" style="margin-bottom:1rem">
        <input type="text" id="new-det" placeholder="Nouvelle nature de dette..." />
        <button class="btn small primary" onclick="addCat('dettes')"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
      <div class="divider"></div>
      <div class="section-label" style="margin-top:.75rem">Créances</div>
      <div class="cats-row" id="cats-creances"></div>
      <div class="add-cat">
        <input type="text" id="new-cre" placeholder="Nouvelle nature de créance..." />
        <button class="btn small primary" onclick="addCat('creances')"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title" style="margin-bottom:1rem"><i class="ti ti-pencil"></i> Nouvelle entrée</div>
      <div class="form-row">
        <div class="field"><label>Date</label><input type="date" id="dc-date" /></div>
        <div class="field"><label>Type</label>
          <select id="dc-type" onchange="updateDcNature()">
            <option value="créance">Créance</option>
            <option value="dette">Dette</option>
          </select>
        </div>
        <div class="field"><label>Nature</label><select id="dc-nature"></select></div>
        <div class="field"><label>Montant (Ar)</label><input type="number" id="dc-montant" placeholder="0" min="0" /></div>
      </div>
      <div class="form-row-3">
        <div class="field"><label>Contrepartie</label><input type="text" id="dc-partie" placeholder="Nom personne / entité..." /></div>
        <div class="field"><label>Description</label><input type="text" id="dc-desc" placeholder="Précisions..." /></div>
        <button class="btn primary" onclick="addDC()"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><i class="ti ti-list"></i> Journal</div>
        <button class="btn small" onclick="exportCSV('dc')"><i class="ti ti-download"></i> Exporter CSV</button>
      </div>
      <div class="filter-row">
        <select id="f-dc-type" onchange="renderDC()">
          <option value="">Tous types</option>
          <option value="dette">Dettes</option>
          <option value="créance">Créances</option>
        </select>
        <select id="f-dc-nature" onchange="renderDC()"><option value="">Toutes natures</option></select>
        <input type="date" id="f-dc-from" onchange="renderDC()" title="Du" />
        <input type="date" id="f-dc-to" onchange="renderDC()" title="Au" />
        <button class="btn small" onclick="resetFilters('dc')"><i class="ti ti-x"></i> Réinitialiser</button>
      </div>
      <div id="table-dc"></div>
    </div>
  </div>
</div>

<script>
let cats = {
  depenses: ['Alimentation','Transport','Loyer','Santé','Loisirs'],
  recettes: ['Salaire','Vente','Investissement','Don'],
  dettes: ['Emprunt bancaire','Prêt personnel','Fournisseur'],
  creances: ['Prêt accordé','Facture client','Avance']
};
let drEntries = [];
let dcEntries = [];

function fmt(n) { return Number(n).toLocaleString('fr-MG'); }
function today() { return new Date().toISOString().split('T')[0]; }

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', ['depenses','dettes'][i] === t));
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.getElementById('sec-' + t).classList.add('active');
}

function renderCats(key) {
  const el = document.getElementById('cats-' + key);
  if (!el) return;
  el.innerHTML = cats[key].map(c =>
    `<span class="cat-tag">${c}<span class="remove" onclick="removeCat('${key}','${c.replace(/'/g,"\\'")}')">✕</span></span>`
  ).join('');
  updateSelects();
}

function addCat(key) {
  const idMap = { depenses:'new-dep', recettes:'new-rec', dettes:'new-det', creances:'new-cre' };
  const inp = document.getElementById(idMap[key]);
  const v = inp.value.trim();
  if (v && !cats[key].includes(v)) { cats[key].push(v); inp.value = ''; renderCats(key); }
}

function removeCat(key, c) {
  cats[key] = cats[key].filter(x => x !== c);
  renderCats(key);
}

function updateSelects() {
  const drType = document.getElementById('dr-type')?.value;
  const sel = document.getElementById('dr-nature');
  if (sel) {
    const list = drType === 'depense' ? cats.depenses : cats.recettes;
    sel.innerHTML = list.map(c => `<option>${c}</option>`).join('');
  }
  const dcType = document.getElementById('dc-type')?.value;
  const sel2 = document.getElementById('dc-nature');
  if (sel2) {
    const list = dcType === 'dette' ? cats.dettes : cats.creances;
    sel2.innerHTML = list.map(c => `<option>${c}</option>`).join('');
  }
  updateFilterNatures();
}

function updateDrNature() { updateSelects(); }
function updateDcNature() { updateSelects(); }

function updateFilterNatures() {
  const fn = document.getElementById('f-dr-nature');
  if (fn) {
    const all = [...cats.depenses, ...cats.recettes].filter((v, i, a) => a.indexOf(v) === i);
    fn.innerHTML = '<option value="">Toutes natures</option>' + all.map(c => `<option>${c}</option>`).join('');
  }
  const fn2 = document.getElementById('f-dc-nature');
  if (fn2) {
    const all = [...cats.dettes, ...cats.creances].filter((v, i, a) => a.indexOf(v) === i);
    fn2.innerHTML = '<option value="">Toutes natures</option>' + all.map(c => `<option>${c}</option>`).join('');
  }
}

function addDR() {
  const d = document.getElementById('dr-date').value;
  const t = document.getElementById('dr-type').value;
  const n = document.getElementById('dr-nature').value;
  const m = parseFloat(document.getElementById('dr-montant').value);
  const desc = document.getElementById('dr-desc').value;
  if (!d || !n || isNaN(m) || m <= 0) { alert('Veuillez remplir tous les champs requis (date, nature, montant).'); return; }
  drEntries.unshift({ id: Date.now(), date: d, type: t, nature: n, montant: m, desc });
  document.getElementById('dr-montant').value = '';
  document.getElementById('dr-desc').value = '';
  renderDR(); renderSummaryDR();
}

function deleteDR(id) {
  if (!confirm('Supprimer cette transaction ?')) return;
  drEntries = drEntries.filter(e => e.id !== id);
  renderDR(); renderSummaryDR();
}

function addDC() {
  const d = document.getElementById('dc-date').value;
  const t = document.getElementById('dc-type').value;
  const n = document.getElementById('dc-nature').value;
  const m = parseFloat(document.getElementById('dc-montant').value);
  const partie = document.getElementById('dc-partie').value;
  const desc = document.getElementById('dc-desc').value;
  if (!d || !n || isNaN(m) || m <= 0) { alert('Veuillez remplir tous les champs requis (date, nature, montant).'); return; }
  dcEntries.unshift({ id: Date.now(), date: d, type: t, nature: n, montant: m, partie, desc });
  document.getElementById('dc-montant').value = '';
  document.getElementById('dc-partie').value = '';
  document.getElementById('dc-desc').value = '';
  renderDC(); renderSummaryDC();
}

function deleteDC(id) {
  if (!confirm('Supprimer cette entrée ?')) return;
  dcEntries = dcEntries.filter(e => e.id !== id);
  renderDC(); renderSummaryDC();
}

function getFilteredDR() {
  let data = [...drEntries];
  const ft = document.getElementById('f-dr-type')?.value;
  const fn = document.getElementById('f-dr-nature')?.value;
  const ff = document.getElementById('f-dr-from')?.value;
  const ft2 = document.getElementById('f-dr-to')?.value;
  if (ft) data = data.filter(e => e.type === ft);
  if (fn) data = data.filter(e => e.nature === fn);
  if (ff) data = data.filter(e => e.date >= ff);
  if (ft2) data = data.filter(e => e.date <= ft2);
  return data;
}

function getFilteredDC() {
  let data = [...dcEntries];
  const ft = document.getElementById('f-dc-type')?.value;
  const fn = document.getElementById('f-dc-nature')?.value;
  const ff = document.getElementById('f-dc-from')?.value;
  const ft2 = document.getElementById('f-dc-to')?.value;
  if (ft) data = data.filter(e => e.type === ft);
  if (fn) data = data.filter(e => e.nature === fn);
  if (ff) data = data.filter(e => e.date >= ff);
  if (ft2) data = data.filter(e => e.date <= ft2);
  return data;
}

function renderDR() {
  const data = getFilteredDR();
  const el = document.getElementById('table-dr');
  if (!data.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-inbox"></i>Aucune transaction enregistrée</div>';
    return;
  }
  el.innerHTML = `<table><thead><tr>
    <th>Date</th><th>Type</th><th>Nature</th><th>Montant (Ar)</th><th>Description</th><th></th>
  </tr></thead><tbody>` +
    data.map(e => `<tr>
      <td>${e.date}</td>
      <td><span class="badge ${e.type}">${e.type === 'recette' ? 'Recette' : 'Dépense'}</span></td>
      <td>${e.nature}</td>
      <td style="font-weight:500;color:${e.type === 'recette' ? '#1D9E75' : '#D85A30'}">${e.type === 'recette' ? '+' : '-'}${fmt(e.montant)} Ar</td>
      <td style="color:#6b6b66">${e.desc || '—'}</td>
      <td><button class="btn danger small" onclick="deleteDR(${e.id})" title="Supprimer"><i class="ti ti-trash"></i></button></td>
    </tr>`).join('') +
  `</tbody></table>`;
}

function renderDC() {
  const data = getFilteredDC();
  const el = document.getElementById('table-dc');
  if (!data.length) {
    el.innerHTML = '<div class="empty"><i class="ti ti-inbox"></i>Aucune entrée enregistrée</div>';
    return;
  }
  el.innerHTML = `<table><thead><tr>
    <th>Date</th><th>Type</th><th>Nature</th><th>Contrepartie</th><th>Montant (Ar)</th><th>Description</th><th></th>
  </tr></thead><tbody>` +
    data.map(e => `<tr>
      <td>${e.date}</td>
      <td><span class="badge ${e.type}">${e.type === 'dette' ? 'Dette' : 'Créance'}</span></td>
      <td>${e.nature}</td>
      <td>${e.partie || '—'}</td>
      <td style="font-weight:500;color:${e.type === 'créance' ? '#1D9E75' : '#D85A30'}">${fmt(e.montant)} Ar</td>
      <td style="color:#6b6b66">${e.desc || '—'}</td>
      <td><button class="btn danger small" onclick="deleteDC(${e.id})" title="Supprimer"><i class="ti ti-trash"></i></button></td>
    </tr>`).join('') +
  `</tbody></table>`;
}

function renderSummaryDR() {
  const recettes = drEntries.filter(e => e.type === 'recette').reduce((s, e) => s + e.montant, 0);
  const depenses = drEntries.filter(e => e.type === 'depense').reduce((s, e) => s + e.montant, 0);
  const solde = recettes - depenses;
  document.getElementById('sum-dr').innerHTML = `
    <div class="metric"><div class="metric-label">Total recettes</div><div class="metric-value" style="color:#1D9E75">+${fmt(recettes)} Ar</div></div>
    <div class="metric"><div class="metric-label">Total dépenses</div><div class="metric-value" style="color:#D85A30">-${fmt(depenses)} Ar</div></div>
    <div class="metric"><div class="metric-label">Solde net</div><div class="metric-value" style="color:${solde >= 0 ? '#1D9E75' : '#D85A30'}">${solde >= 0 ? '+' : ''}${fmt(solde)} Ar</div></div>
    <div class="metric"><div class="metric-label">Nb transactions</div><div class="metric-value">${drEntries.length}</div></div>`;
}

function renderSummaryDC() {
  const creances = dcEntries.filter(e => e.type === 'créance').reduce((s, e) => s + e.montant, 0);
  const dettes = dcEntries.filter(e => e.type === 'dette').reduce((s, e) => s + e.montant, 0);
  const net = creances - dettes;
  document.getElementById('sum-dc').innerHTML = `
    <div class="metric"><div class="metric-label">Total créances</div><div class="metric-value" style="color:#1D9E75">+${fmt(creances)} Ar</div></div>
    <div class="metric"><div class="metric-label">Total dettes</div><div class="metric-value" style="color:#D85A30">-${fmt(dettes)} Ar</div></div>
    <div class="metric"><div class="metric-label">Position nette</div><div class="metric-value" style="color:${net >= 0 ? '#1D9E75' : '#D85A30'}">${net >= 0 ? '+' : ''}${fmt(net)} Ar</div></div>
    <div class="metric"><div class="metric-label">Nb entrées</div><div class="metric-value">${dcEntries.length}</div></div>`;
}

function resetFilters(t) {
  if (t === 'dr') {
    document.getElementById('f-dr-type').value = '';
    document.getElementById('f-dr-nature').value = '';
    document.getElementById('f-dr-from').value = '';
    document.getElementById('f-dr-to').value = '';
    renderDR();
  } else {
    document.getElementById('f-dc-type').value = '';
    document.getElementById('f-dc-nature').value = '';
    document.getElementById('f-dc-from').value = '';
    document.getElementById('f-dc-to').value = '';
    renderDC();
  }
}

function exportCSV(t) {
  const data = t === 'dr' ? drEntries : dcEntries;
  if (!data.length) { alert('Aucune donnée à exporter.'); return; }
  const headers = t === 'dr'
    ? 'Date,Type,Nature,Montant,Description'
    : 'Date,Type,Nature,Contrepartie,Montant,Description';
  const rows = data.map(e => t === 'dr'
    ? `${e.date},${e.type},${e.nature},${e.montant},"${e.desc || ''}"`
    : `${e.date},${e.type},${e.nature},"${e.partie || ''}",${e.montant},"${e.desc || ''}"`);
  const csv = [headers, ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = t === 'dr' ? 'depenses_recettes.csv' : 'dettes_creances.csv';
  a.click();
}

// Init
document.getElementById('dr-date').value = today();
document.getElementById('dc-date').value = today();
['depenses', 'recettes', 'dettes', 'creances'].forEach(renderCats);
renderSummaryDR();
renderSummaryDC();
renderDR();
renderDC();
</script>
